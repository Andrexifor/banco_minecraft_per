name: Compilar y testear

on:
  push:
    branches: [main, "mc/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar y correr tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      # Si falla, publica los errores como anotaciones (se ven sin abrir el log)
      - name: Resumen de errores
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Could not (resolve|find)|> ' build.log \
            | grep -v '^\s*at ' | head -n 40 > errores.txt || true
          [ -s errores.txt ] || tail -n 40 build.log > errores.txt
          i=0
          while IFS= read -r linea; do
            i=$((i+1)); [ $i -le 10 ] || break
            echo "::error title=Gradle ($i)::${linea:0:900}"
          done < errores.txt
          { echo '```'; cat errores.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Validar JSON del resource pack
        run: |
          find resourcepack -name '*.json' -o -name '*.mcmeta' | while read -r f; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::JSON inválido"; exit 1; }
          done

      - name: Empaquetar resource pack
        run: |
          cd resourcepack && zip -qr ../banco_minecraft_per-pack.zip . && cd ..
          sha1sum banco_minecraft_per-pack.zip

      - uses: actions/upload-artifact@v4
        with:
          name: banco_minecraft_per
          path: |
            build/libs/banco_minecraft_per-*.jar
            banco_minecraft_per-pack.zip
            build/reports/tests/
