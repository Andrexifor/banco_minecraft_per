name: Compilar y testear

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar y correr tests
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Validar JSON del resource pack
        run: |
          find resourcepack -name '*.json' -o -name '*.mcmeta' | while read -r f; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::JSON inválido"; exit 1; }
          done

      - name: Empaquetar resource pack
        run: |
          cd resourcepack && zip -qr ../banco_minecraft_per-pack.zip . && cd ..
          sha1sum banco_minecraft_per-pack.zip

      - uses: actions/upload-artifact@v4
        with:
          name: banco_minecraft_per
          path: |
            build/libs/banco_minecraft_per-*.jar
            banco_minecraft_per-pack.zip
            build/reports/tests/
