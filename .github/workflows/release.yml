name: Publicar versión

# Se ejecuta al subir un tag, por ejemplo:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build -PmodVersion="${GITHUB_REF_NAME#v}" --stacktrace

      - name: Empaquetar resource pack y su SHA1
        run: |
          cd resourcepack && zip -qr ../banco_minecraft_per-pack.zip . && cd ..
          sha1sum banco_minecraft_per-pack.zip | cut -d' ' -f1 > banco_minecraft_per-pack.zip.sha1
          echo "SHA1: $(cat banco_minecraft_per-pack.zip.sha1)"

      - name: Leer versión de Minecraft
        run: echo "MC=$(grep '^minecraftVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/banco_minecraft_per-*.jar | grep -v sources | head -n1)
          cp "$JAR" banco_minecraft_per.jar
          # si se vuelve a publicar la misma versión (tag movido), se reemplaza el release anterior
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            banco_minecraft_per.jar \
            banco_minecraft_per-pack.zip \
            banco_minecraft_per-pack.zip.sha1 \
            --title "Banco Minecraft PER $GITHUB_REF_NAME (Minecraft $MC)" \
            --notes "Para Minecraft $MC. SHA1 del resource pack: $(cat banco_minecraft_per-pack.zip.sha1)"
